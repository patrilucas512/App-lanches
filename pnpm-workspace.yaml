# Instaladores nativos usados no build do Site e revisados para publicação.
allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Versões transitivas mínimas com correções de segurança para as ferramentas de build.
overrides:
  "brace-expansion@>=4.0.0 <5.0.11": 5.0.12
  "fast-uri@>=3.0.0 <3.1.7": 3.1.7
  "image-size@>=0.6.3 <=2.0.2": 2.0.4
  "sharp@<0.35.0": 0.35.5
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "ws@>=8.0.0 <8.21.0": 8.22.0
